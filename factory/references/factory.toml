# .factory/factory.toml: how the factory works on this repository.
#
# It lives on the branch factory_board, which holds only .factory/ and
# shares no history with the code. Set it up once, from a clean checkout:
#
#   git switch --orphan factory_board
#   mkdir -p .factory/{backlog,new,review,ready,done,stop}
#   touch .factory/{backlog,new,review,ready,done,stop}/.gitkeep
#   cp /path/to/this/factory.toml .factory/    # then set the values
#   git add .factory && git commit -m "Start the factory board"
#   git push -u origin factory_board && git switch master
#
# A board that is still in .factory/ on master moves the same way: replace
# the mkdir, touch and cp lines with `git checkout master -- .factory` (and
# make backlog/ if it is missing). Then remove it from master in one commit:
# `git rm -r .factory`. The items' earlier moves stay in master's history.
#
# To edit the board, keep a second worktree of it beside your clone:
#   git worktree add ../<repo>-board factory_board
#
# To show the board as a web page on GitHub Pages, see board-pages.yml.

# The branch builds start from, and a ship run merges into: the only
# time the factory pushes to it. The remote is origin.
base = "master"

# Names whose "## name · time" sections count as yours: requests,
# answers and notes. Sections by other names are read as
# information only. The manager signs its own sections "factory";
# leave that name out.
owners = ["alex"]

# What must pass: after each build, in each review, and on base before
# a ship run pushes it. A ship runs only each item's own tests after its
# merge, and this command once after the last.
test = "make test"

# Run after changes that need generated files or catalogs updated.
after_change = []

# Read before building or reviewing.
read = ["AGENTS.md"]

# Paths the factory must never change.
never = [".github/workflows/", ".factory/factory.toml"]

# Added to the coder's rules for this repository.
rules = [
  "Scripted tests get a throwaway HOME.",
]

# How many builds an item gets. A review that finds P0 or P1 sends the
# item back to new/ for a fix round while its round is below this; at
# the limit it stays in review/ and you decide. Default: 1 (every P0/P1
# review waits for you).
max_rounds = 3

# What a ship does with the items it takes, in this order:
#   merge  merge each item into base and run test on the result
#   tag    tag the merged base with the next version: v1.4.2, then v1.4.3
#          (v0.1.0 when there is no vX.Y.Z tag yet)
#   push   push base and the tag, close linked issues and PRs, and move
#          the items to done/
#   clean  after push, delete the factory/ branches of items in done/
#          that are merged into base (needs the branch rules in
#          github-app.md to allow it)
# Leave out tag to ship without tags. Without push, a ship only checks
# that the items merge and pass, and says so; nothing is pushed or moved.
# [] stops ships from merging anything. Default: merge, tag and push.
ship = ["merge", "tag", "push"]

# Capital letters before item numbers: FT16 in file names, branches and
# messages, so they are not mistaken for issue or PR numbers. Default: FT.
prefix = "FT"

# How you see the board, besides the item files:
#   web   a page on GitHub Pages, published on each push by board-pages.yml
#         (set it up once; the factory itself does nothing)
#   text  .factory/board.txt, plain text the factory rewrites after each run
#         that changes the board: read it on GitHub, or with cat after a pull
#   off   neither
# Default: web. Switching away from text leaves board.txt as it is.
board = "web"

# The clock for section times and the board page (scripts/board.py),
# so CI in UTC shows the same times as the files. Default: the machine's.
timezone = "Europe/Berlin"
